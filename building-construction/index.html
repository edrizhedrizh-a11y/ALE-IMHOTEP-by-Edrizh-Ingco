function getChoices(c){if(!$('shuffleToggle').checked)return c.choices;const key=c.id; if(!choiceOrder[key]) choiceOrder[key]=shuffle(c.choices,Date.now()+c.qNo); return choiceOrder[key]}
function reshuffle(){const c=view[current]; if(c){choiceOrder[c.id]=shuffle(c.choices,Date.now()+Math.floor(Math.random()*99999)); render()}}
function render(){const c=view[current]; if(!c)return;save();$('qid').textContent=c.displayId||c.id;$('topic').textContent=c.topic;$('question').textContent=c.question;$('pos').textContent=(current+1)+'/'+view.length;let correct=0,miss=0,mark=0;allCards.forEach(x=>{if(answers[x.id]?.correct)correct++; if(answers[x.id]?.correct===false)miss++; if(marks[x.id])mark++});$('score').textContent=correct;$('missed').textContent=miss;$('marked').textContent=mark;$('bar').style.width=(Object.keys(answers).length/allCards.length*100)+'%';const answered=answers[c.id];$('choices').innerHTML=getChoices(c).map((ch,i)=>{let cls='choice'; if(answered){if(ch.isCorrect)cls+=' correct'; else if(answered.text===ch.text)cls+=' wrong'} return `<button class="${cls}" data-choice="${esc(ch.text)}"><span class="letter">${String.fromCharCode(65+i)}</span><span>${esc(ch.text)}</span></button>`}).join('');document.querySelectorAll('.choice').forEach(btn=>btn.onclick=()=>choose(btn.dataset.choice));renderAnswer(c,answered);document.querySelectorAll('.markrow button').forEach(b=>b.classList.toggle('active',marks[c.id]===b.dataset.mark));renderMini()}
function renderAnswer(c,answered){const box=$('answerBox'); if(!answered){box.className='answerBox';box.innerHTML='';return} box.className='answerBox show';box.innerHTML=`<h3>${answered.correct?'Tama ✅':'Mali muna ❌'} — ${esc(c.correctAnswer)}</h3><p><b>Why this is best:</b> ${esc(c.whyBest)}</p><p><b>Why others are tempting but not best:</b> ${esc(c.whyOthers)}</p><p><b>Construction logic:</b> ${esc(c.constructionLogic)}</p><p><b>Need to remember:</b> ${esc(c.needToRemember)}</p><p><b>Board exam trap:</b> ${esc(c.boardExamTrap)}</p><p><b>Memory hook:</b> ${esc(c.memoryHook)}</p>`}
function choose(text){const c=view[current]; const correct=getChoices(c).find(x=>x.isCorrect);answers[c.id]={text,correct:text===correct.text,at:Date.now()};save();render()}
function renderMini(){const box=$('miniList');box.innerHTML=view.slice(0,250).map((c,i)=>{const a=answers[c.id],m=marks[c.id];return `<button class="mini ${i===current?'active':''}" data-i="${i}"><span>${esc(c.displayId)} ${a?(a.correct?'✅':'❌'):''}</span><span>${m?esc(m):''}</span></button>`}).join('');box.querySelectorAll('.mini').forEach(b=>b.onclick=()=>{current=+b.dataset.i;render()})}
document.addEventListener('click',e=>{if(e.target.matches('.markrow button')){const c=view[current];const v=e.target.dataset.mark;marks[c.id]=marks[c.id]===v?'':v;save();render()}});
$('prevBtn').onclick=()=>{current=Math.max(0,current-1);render()};$('nextBtn').onclick=()=>{current=Math.min(view.length-1,current+1);render()};$('randomBtn').onclick=()=>{current=Math.floor(Math.random()*view.length);render()};$('jumpBtn').onclick=()=>{const n=Number($('jump').value);const i=view.findIndex(c=>c.qNo===n);if(i>=0){current=i;render()}};$('resetBtn').onclick=()=>{if(confirm('Reset progress for this deck?')){answers={};marks={};choiceOrder={};current=0;save();render()}};$('search').oninput=()=>{applyView();render()};$('topicFilter').onchange=()=>{applyView();render()};$('mode').onchange=()=>{applyView();render()};$('reshuffleBtn').onclick=reshuffle;$('shuffleToggle').onchange=()=>{choiceOrder={};render()};load();
</script></body></html>
